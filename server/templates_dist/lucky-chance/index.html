  <body class="relative w-screen h-screen m-0 p-0 text-white select-none">
    <div
      id="previewDemoWatermark"
      class="preview-demo-watermark"
      hidden
      aria-hidden="true"
    >
      <div class="preview-demo-watermark__grid" aria-hidden="true"></div>
      <p class="preview-demo-watermark__badge">Xem Demo</p>
    </div>

    <!-- Màn giới thiệu — chạm icon để vào -->
    <div id="intro-screen" class="intro-screen">
      <div class="intro-glow" aria-hidden="true"></div>
      <div class="intro-sparkles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span
        ><span></span>
      </div>

      <div class="intro-content">
        <p class="intro-eyebrow">Lucky Chance</p>
        <h1 class="intro-title" id="intro-title">
          <span class="intro-title-line">Gửi may mắn đến</span>
          <span id="intro-recipient-name" class="intro-title-recipient"
            >người thương</span
          >
        </h1>

        <button
          type="button"
          id="intro-start-btn"
          class="intro-start-btn"
          aria-label="Bắt đầu"
        >
          <img
            src="./asset/icons/iconIntro.png"
            alt=""
            class="intro-icon"
            width="200"
            height="200"
            decoding="async"
          />
        </button>

        <p class="intro-hint">Chạm cỏ may mắn để bắt đầu</p>
      </div>
    </div>

    <!-- Màn chính — ẩn cho đến khi qua intro -->
    <div id="app-main" class="app-main app-main--hidden" hidden>
      <div id="image-text-fly-screen" class="image-text-fly-screen">
        <div id="wishes-layer" class="wishes-layer">
          <div class="wishes-layer-space">
            <div id="falling-container" class="falling-container"></div>
          </div>
        </div>
        <div class="fly-gradient-overlay" aria-hidden="true"></div>
      </div>

      <div class="ui-deco-layer" aria-hidden="true">
        <div class="top-deco-strip"></div>
        <img
          src="./asset/icons/gocDuoi.png"
          alt=""
          class="corner-deco corner-deco--bottom-left"
          width="220"
          height="220"
          decoding="async"
        />
        <img
          src="./asset/icons/luckyDuoi.png"
          alt=""
          class="corner-deco corner-deco--bottom-right"
          width="220"
          height="220"
          decoding="async"
        />
        <div class="chuong-slot chuong-slot--left">
          <img
            src="./asset/icons/chuongTren.png"
            alt=""
            class="chuong-icon"
            decoding="async"
          />
        </div>
        <div class="chuong-slot chuong-slot--right">
          <img
            src="./asset/icons/chuongTren.png"
            alt=""
            class="chuong-icon chuong-icon--flip"
            decoding="async"
          />
        </div>
      </div>
    </div>
    <!-- #app-main -->

    <script src="./js/preview-draft-storage.js"></script>
    <script src="./js/music.js" defer></script>
    <script src="./js/top-deco.js" defer></script>
    <script src="./js/fly-effects.js" defer></script>
    <script src="./js/main.js" defer></script>
